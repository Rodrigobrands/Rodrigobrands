<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NovaTech Solutions - Contato</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet" />
</head>
<body>

<header class="header">
  <div class="container header-container">
    <div class="logo"><a href="index.html">NovaTech <span>Solutions</span></a></div>
    <nav class="nav" id="nav-menu">
      <a href="index.html">Início</a>
      <a href="sobre.html">Sobre Nós</a>
      <a href="servicos.html">Serviços</a>
      <a href="portfolio.html">Portfólio</a>
      <a href="contato.html" class="active">Contato</a>
    </nav>
    <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">&#9776;</button>
  </div>
</header>

<main class="contato-pagina">

  <section class="hero hero-contato">
    <div class="container hero-content">
      <h1 class="fade-in">Fale Conosco</h1>
      <p class="fade-in delay-1">Estamos prontos para ajudar você. Envie sua mensagem!</p>
    </div>
  </section>

  <section class="container conteudo fade-in-up">

    <form id="contact-form" novalidate>
      <div class="form-group">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required minlength="3" placeholder="Seu nome" />
        <small class="error-message"></small>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required placeholder="exemplo@seudominio.com" />
        <small class="error-message"></small>
      </div>

      <div class="form-group">
        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" required minlength="10" rows="5" placeholder="Escreva sua mensagem"></textarea>
        <small class="error-message"></small>
      </div>

      <button type="submit" class="btn btn-neon">Enviar</button>
      <p id="form-success" class="success-message" aria-live="polite" role="alert"></p>
    </form>

    <div class="map-container">
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3656.092281436991!2d-46.64512308448015!3d-23.589210084672734!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce59c452b97087%3A0x69e7c8e31b6b5e6f!2sAv.%20Paulista%2C%202345%20-%20Bela%20Vista%2C%20S%C3%A3o%20Paulo%20-%20SP%2C%2001311-200!5e0!3m2!1spt-BR!2sbr!4v1687199979553!5m2!1spt-BR!2sbr" 
        width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" 
        title="Mapa NovaTech Solutions"></iframe>
    </div>

  </section>

</main>

<footer class="footer">
  <div class="container footer-container">
    <p>&copy; 2025 NovaTech Solutions. Todos os direitos reservados.</p>
    <div class="social">
      <a href="#" aria-label="Site">🌐</a>
      <a href="#" aria-label="Facebook">📘</a>
      <a href="#" aria-label="Twitter">🐦</a>
    </div>
  </div>
</footer>

<button id="btn-topo" aria-label="Voltar ao topo">↑</button>

<script src="script.js"></script>
</body>
</html>
